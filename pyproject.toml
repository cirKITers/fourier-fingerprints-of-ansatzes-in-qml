[project]
name = "saqml"
readme = "README.md"
dynamic = [ "dependencies", "version",]

[project.scripts]
saqml = "saqml.__main__:main"

[tool.kedro]
package_name = "saqml"
project_name = "saqml"
kedro_init_version = "0.19.6"
tools = [ "Testing", "Custom Logging", "Kedro Viz",]
example_pipeline = "False"
source_dir = "src"

[project.entry-points."kedro.hooks"]

[tool.pytest.ini_options]
addopts = "--cov-report term-missing --cov src/saqml -ra"

[tool.coverage.report]
fail_under = 0
show_missing = true
exclude_lines = [ "pragma: no cover", "raise NotImplementedError",]

[tool.setuptools.dynamic.dependencies]
file = "requirements.txt"

[tool.setuptools.dynamic.version]
attr = "saqml.__version__"

[tool.setuptools.packages.find]
where = [ "src",]
namespaces = false


[tool.poetry]
name = "saqml"
version = "0.1.0"
description = ""
authors = ["Melvin Strobl <lc3267@kit.edu>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.11,<3.12"
mlflow = "^2.20.2"
pytest = "^8.2.2"
kedro = "^0.19.11"
kedro-mlflow = "^0.14.3"
kedro-viz = "^9.1.0"
plotly = "^5.22.0"
tenacity = "^8.5.0"
kaleido = "0.2.1"
qml-essentials = "^0.1.31"
h5py = "^3.13.0"
aiohttp = "^3.11.16"
vector = "^1.6.2"


[[tool.poetry.source]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
[tool.kedro_telemetry]
project_id = "c91edbf77bd8405a836ad827e8ab1b1e"
