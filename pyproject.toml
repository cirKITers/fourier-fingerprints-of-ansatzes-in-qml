[project]
name = "fourier-fingerprints"
version = "0.1.0"
description = "Fourier fingerprints of ansaetze in quantum machine learning"
authors = [{ name = "Melvin Strobl", email = "lc3267@kit.edu" }]
requires-python = ">=3.12,<3.13"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "qml-essentials>=0.3.1",
    "jaqsi>=0.1.1",
    "fluksio>=0.1.6",
    "h5py>=3.16.0",
    "torch>=2.9.1",
    "jax>=0.9.0.1",
    "optax>=0.2.7",
    "numpy>=2.0",
    "scipy>=1.17",
    "scikit-learn>=1.7",
    "pandas>=2.2",
    "matplotlib>=3.10,<3.11",
    "jinja2>=3.1",
]

[dependency-groups]
dev = ["ruff>=0.12", "pytest>=8"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]
torchvision = [
    { index = "pytorch-cpu" },
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fourier_fingerprints"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
