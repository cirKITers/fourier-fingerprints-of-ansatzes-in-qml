data:
  fourier:
    domain: [0, 6.283185307] # domain of x values
    omegas: 5 # number of frequencies in each dimension
    offset: False
    coefficients:
      distribution: uniform # None, uniform, normal
      mean: 0.0 # if None, can also be an array with len(omegas)
      variance: 1.0 # if uniform mean+-variance defines limit
    samples:
      distribution: uniform # None, uniform, normal
      mean: 0.0
      variance: 0.5
  hep:
    n_events: 40000
    features: ["E_CM", "delta_E"]
    scaling_methods: ["QuantileTransformer_Uniform", "MinMaxZHalf"]
    labels: ["leading_pt"]
  seed: 1000
  mts: 1
  mfs: 1

coefficients:
  n_samples: 300 #samples per parameter
  correlation_method: "pearson" #dcor, pearson, spearman
  triu: True # only use  the upper triangular part of the correlation matrix?
  weighting: "linear" # linear, coefficients_prod, coefficients_add, frequencies
  force_same: False

expressibility:
  n_samples: 300 #samples per parameter scaling exp. with n qubits
  n_bins: 20 #scaling lin. with n qubits

model:
  n_qubits: 5
  n_layers: 1
  circuit_type: "Circuit_19" # Circuit_1, Circuit_5, Circuit_6, Circuit_9, Circuit_15, Circuit_18, Circuit_19, Hardware_Efficient, Strongly_Entangling, No_Entangling, Circuit_YZY, Circuit_YZY_Entangling
  data_reupload: True
  encoding: ["RX"]
  output_qubit: -1
  initialization: "random" # random, zero-controlled, pi-controlled
  initialization_domain: [0, 6.283185307179586]
  layer_multiplier: 1 # repeat the variational layer without data reuploading
  noise_params:
    BitFlip: 0.0
    PhaseFlip: 0.0
    AmplitudeDamping: 0.0
    PhaseDamping: 0.0
    Depolarizing: 0.0
  mp_threshold: -1

seed: 1000

n_control_values: 0 # for sweeping control values

training:
  steps: 2000 # hep 500, fs1d 1000 fs2d 2000
  learning_rate: 0.01
  batch_size: -1
  log_entangling: False
  log_coefficients: False # track coefficients during training?
  positive_coeffs_only: True
  loss_function: ["mse", "null_loss"]
  loss_scaler: [1.0, 0.001]
  convergence:
    threshold: -1 # threshold for the cost, -1 to disable
    gradient: -1 # threshold for the cost gradient, -1 to disable
    steps: 50 # gradient is checked for the last n steps (mavg)
